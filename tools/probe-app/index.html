<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Ross-Tech Probe</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 20px; color: #1d1d1f; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .safe { background: #e8f5e9; padding: 8px 12px; border-radius: 6px; }
  ol { line-height: 1.6; }
  button { font-size: 15px; padding: 8px 16px; margin-right: 8px; }
  #run { background: #0071e3; color: #fff; border: 0; border-radius: 6px; }
  button:disabled { opacity: 0.5; }
  pre { background: #111; color: #9f9; padding: 12px; height: 260px; overflow: auto;
        font-size: 12px; border-radius: 6px; white-space: pre-wrap; }
  #msg { margin-left: 8px; color: #555; }
</style>
</head>
<body>
<h1>Ross-Tech Probe</h1>
<p class="safe">This app only reads. It sends nothing to the cable and nothing to the car.</p>
<h2 style="font-size:16px">Before you start</h2>
<ol>
  <li>Plug the cable into the Mac and into the car.</li>
  <li>Turn the car ignition on. The engine does not need to run.</li>
  <li>Close VCDS and any other diagnostic program.</li>
</ol>
<p><button id="run">Run probe</button>
<button id="save" disabled>Save output</button>
<button id="copy" disabled>Copy</button><span id="msg"></span></p>
<pre id="out">The output shows here.</pre>
<script>
  const out = document.getElementById('out');
  const msg = document.getElementById('msg');
  const run = document.getElementById('run');
  const save = document.getElementById('save');
  const copy = document.getElementById('copy');
  let text = '';
  window.probe.onLine((line) => {
    text += line + '\n';
    out.textContent = text;
    out.scrollTop = out.scrollHeight;
  });
  run.onclick = async () => {
    text = '';
    out.textContent = 'Running. Wait about 5 seconds...\n';
    msg.textContent = '';
    run.disabled = save.disabled = copy.disabled = true;
    await window.probe.run();
    run.disabled = save.disabled = copy.disabled = false;
  };
  save.onclick = async () => {
    const r = await window.probe.save(text);
    msg.textContent = r.saved ? 'Saved: ' + r.path : 'Not saved.';
  };
  copy.onclick = async () => {
    await window.probe.copy(text);
    msg.textContent = 'Copied.';
  };
</script>
</body>
</html>
